<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Ops Assistant</title>
  <!-- Markdown renderer (embarqué : l'app fonctionne hors ligne) -->
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d2e;
      --border:    #2d3748;
      --accent:    #3182ce;
      --accent-dim:#1e3a5f;
      --text:      #e2e8f0;
      --muted:     #718096;
      --green:     #68d391;
      --green-bg:  #1a3a2a;
      --red:       #fc8181;
      --red-bg:    #3a1a1a;
      --tag-bg:    #2d3748;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── App shell ── */
    .shell { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 52px); }

    /* ── Sidebar nav ── */
    .nav {
      width: 200px;
      background: #111420;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      flex-shrink: 0;
    }

    .nav-logo {
      padding: 0 1rem 1.25rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.75rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      border-left: 2px solid transparent;
      transition: all .15s;
      user-select: none;
    }
    .nav-item:hover  { background: var(--surface); color: var(--text); }
    .nav-item.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-dim); }
    .nav-item .icon  { font-size: 1rem; }

    .nav-bottom {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
    }
    #ollama-status {
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      background: var(--surface);
      color: var(--muted);
      display: inline-block;
    }
    #ollama-status.ok { background: var(--green-bg); color: var(--green); }
    #ollama-status.ko { background: var(--red-bg);   color: var(--red);   }

    /* ── Pages ── */
    .page { display: none; flex: 1; overflow: hidden; }
    .page.active { display: flex; }

    /* ════════════════════════════════
       PAGE : KNOWLEDGE BASE
    ════════════════════════════════ */
    #page-kb { flex-direction: column; }

    .kb-header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .kb-header h2 { font-size: 1rem; font-weight: 600; }
    #kb-count {
      font-size: 0.75rem;
      background: var(--surface);
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
    }
    #kb-search {
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      width: 220px;
    }
    #kb-search:focus { outline: none; border-color: var(--accent); }

    .kb-body {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* Liste de pages */
    .kb-list {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .kb-card {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a1d2e;
      cursor: pointer;
      transition: background .15s;
      border-left: 2px solid transparent;
    }
    .kb-card:hover  { background: var(--surface); }
    .kb-card.active { background: var(--accent-dim); border-left-color: var(--accent); }
    .kb-card h4     { font-size: 0.82rem; margin-bottom: 0.3rem; }
    .kb-card-tags   { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-bottom: 0.25rem; }
    .kb-card-tags span {
      font-size: 0.65rem;
      background: var(--tag-bg);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      color: var(--muted);
    }
    .kb-card-date   { font-size: 0.65rem; color: var(--muted); }

    .kb-empty {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }
    .kb-empty a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* Visionneuse */
    .kb-viewer {
      padding: 2rem;
      overflow-y: auto;
      flex: 1;
    }
    .kb-viewer-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .kb-viewer-content {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    .kb-viewer-content.visible { display: flex; }

    .viewer-title { font-size: 1.25rem; font-weight: 600; }
    .viewer-tags  { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag-badge {
  background: var(--tag-bg);
  border-radius: 4px;
  padding: 0.15rem 0.55rem;
  font-size: 0.75rem;
  color: var(--muted);
  margin-right: 0.3rem;
}
    .edit-tags-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      font-size: 0.72rem;
      cursor: pointer;
      margin-left: 0.4rem;
      transition: border-color .15s, color .15s;
    }
    .edit-tags-btn:hover { border-color: var(--accent); color: var(--accent); }

    .viewer-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      font-size: 0.875rem;
      line-height: 1.7;
      word-break: break-word;
    }
    .viewer-actions { display: inline-flex; gap: 0.4rem; align-items: center; }
    .delete-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Markdown rendu ── */
    .md h1 { font-size: 1.3rem; margin: 0 0 0.75rem; }
    .md h2 { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; color: #90cdf4; }
    .md h3 { font-size: 0.95rem; margin: 1rem 0 0.4rem; }
    .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 0.75rem; }
    .md ul, .md ol { padding-left: 1.4rem; }
    .md li { margin: 0.2rem 0; }
    .md code {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.8rem;
      background: var(--bg);
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
    }
    .md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; overflow-x: auto; }
    .md pre code { background: none; padding: 0; }
    .md a { color: #90cdf4; }
    .md blockquote { border-left: 3px solid var(--border); padding-left: 0.75rem; color: var(--muted); }
    .md table { border-collapse: collapse; }
    .md th, .md td { border: 1px solid var(--border); padding: 0.3rem 0.6rem; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

    /* ── Tag cloud ── */
    .tag-cloud { padding: 0.75rem 1rem; border-top: 1px solid var(--border); margin-top: auto; overflow-y: auto; }
    .tag-cloud h4 { font-size: 0.7rem; letter-spacing: .08em; margin-bottom: 0.5rem; color: var(--muted); font-weight: 600; }
    #tags-container { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    #tags-container .tag-badge { cursor: pointer; margin: 0; font-size: 0.7rem; }
    #tags-container .tag-badge:hover { color: var(--text); }

    /* ════════════════════════════════
       PAGE : INGESTION
    ════════════════════════════════ */
    #page-ingest {
      flex-direction: row;
      overflow: hidden;
    }

    .ingest-left {
      width: 260px;
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .ingest-left h3 {
      font-size: 0.75rem;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .source-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.83rem;
      cursor: pointer;
      transition: all .15s;
    }
    .source-btn:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-dim); }
    .source-btn.active { border-color: var(--accent); background: var(--accent-dim); }
    .source-btn.disabled { opacity: 0.45; cursor: default; }

    .source-btn .source-label { display: flex; align-items: center; gap: 0.5rem; }

    .badge {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 0.15rem 0.45rem;
      border-radius: 99px;
    }
    .badge-active  { background: var(--green-bg); color: var(--green); }
    .badge-soon    { background: var(--tag-bg);   color: var(--muted); }

    .ingest-right {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .ingest-right h2 { font-size: 1rem; font-weight: 600; }

    .field-label {
      font-size: 0.75rem;
      color: #90cdf4;
      font-weight: 500;
      letter-spacing: .05em;
      margin-bottom: 0.35rem;
    }

    textarea#txt-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.875rem;
      resize: vertical;
      line-height: 1.55;
      min-height: 220px;
    }
    textarea#txt-input:focus { outline: none; border-color: var(--accent); }

    #btn-generate {
      align-self: flex-start;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1.4rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background .2s;
    }
    #btn-generate:hover    { background: #2b6cb0; }
    #btn-generate:disabled { background: #4a5568; cursor: wait; }

    .result-box {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }
    .result-box.visible { display: flex; }

    .result-header { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .result-title  { font-size: 0.95rem; font-weight: 600; color: #90cdf4; }
    .result-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      font-size: 0.85rem;
      line-height: 1.7;
      word-break: break-word;
      max-height: 340px;
      overflow-y: auto;
    }
    .result-success {
      font-size: 0.78rem;
      color: var(--green);
      background: var(--green-bg);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      align-self: flex-start;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid #4a5568;
      border-top-color: #90cdf4;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Top bar ── */
    .topbar {
      height: 52px;
      background: #111420;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: .02em;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .topbar-emoji { font-size: 1.1rem; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-emoji">🤖</span>
  Local AI Ops Assistant
</div>

<div class="shell">

  <!-- ── Nav latérale ── -->
  <nav class="nav">
    <div class="nav-logo">NAVIGATION</div>
    <div class="nav-item active" onclick="goTo('kb', this)">
      <span class="icon">🗂️</span> Knowledge Base
    </div>
    <div class="nav-item" onclick="goTo('ingest', this)">
      <span class="icon">⬆️</span> Ingestion
    </div>
    <!-- Tag Cloud -->
    <div class="tag-cloud" id="tag-cloud">
      <h4>TAGS</h4>
      <div id="tags-container"></div>
    </div>
    <div class="nav-bottom">
      <span id="ollama-status">Ollama…</span>
    </div>
  </nav>

  <!-- ══════════════════════════════════
       PAGE : KNOWLEDGE BASE
  ══════════════════════════════════ -->
  <div id="page-kb" class="page active">

    <div class="kb-header">
      <h2>Knowledge Base</h2>
      <span id="kb-count">0 pages</span>
      <input id="kb-search" type="text" placeholder="🔍  Rechercher…" oninput="filterKB(this.value)">
    </div>

    <div class="kb-body">
      <div class="kb-list" id="kb-list">
        <div class="kb-empty">
          Aucune page pour l'instant.<br>
          <a onclick="goTo('ingest', document.querySelectorAll('.nav-item')[1])">
            Ajouter une première source →
          </a>
        </div>
      </div>

      <div class="kb-viewer" id="kb-viewer">
        <div class="kb-viewer-empty">← Sélectionne une page</div>
        <div class="kb-viewer-content" id="viewer-content">
          <div class="viewer-title" id="viewer-title"></div>
          <div class="viewer-tags" id="viewer-tags"></div>
          <div class="viewer-body md" id="viewer-body"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ══════════════════════════════════
       PAGE : INGESTION
  ══════════════════════════════════ -->
  <div id="page-ingest" class="page">

    <div class="ingest-left">
      <h3>SOURCES</h3>

      <div class="source-btn active" onclick="selectSource(this, 'text')">
        <span class="source-label">📝 Texte</span>
        <span class="badge badge-active">ACTIF</span>
      </div>

      <div class="source-btn disabled">
        <span class="source-label">📄 PDF</span>
        <span class="badge badge-soon">Bientôt</span>
      </div>

      <div class="source-btn disabled">
        <span class="source-label">📑 DOCX</span>
        <span class="badge badge-soon">Bientôt</span>
      </div>

      <div class="source-btn disabled">
        <span class="source-label">🖥️ Logs</span>
        <span class="badge badge-soon">Bientôt</span>
      </div>
    </div>

    <div class="ingest-right">
      <h2>Ajouter une source</h2>

      <div>
        <div class="field-label">CONVERSATION / TEXTE</div>
        <textarea id="txt-input"
          placeholder="Colle ici une conversation IT, des notes, un runbook...

Ex :
User: Comment configurer le VPN FortiClient ?
Admin: Télécharge le client sur le portail RH, entre l'adresse vpn.entreprise.fr comme gateway. Ton identifiant est ton login AD."></textarea>
      </div>

      <button id="btn-generate" onclick="generate()">✦ Générer la documentation</button>

      <div class="result-box" id="result-box">
        <div class="result-success" id="result-success"></div>
        <div class="result-header">
          <span class="result-title" id="result-title"></span>
          <div class="viewer-tags" id="result-tags"></div>
        </div>
        <div class="result-body md" id="result-body"></div>
      </div>

    </div>
  </div>

</div>

<script>
  let allPages = [];
  let activeSource = 'text';

  // ── Navigation ───────────────────────────────────────────────────
  function goTo(page, navEl) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    navEl.classList.add('active');
    if (page === 'kb') loadKB();
  }

  function selectSource(el, source) {
    if (el.classList.contains('disabled')) return;
    document.querySelectorAll('.source-btn:not(.disabled)').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    activeSource = source;
  }

  // ── Health ───────────────────────────────────────────────────────
  async function checkHealth() {
    const el = document.getElementById('ollama-status');
    try {
      const r = await fetch('/health');
      const d = await r.json();
      if (d.ollama !== 'ok') {
        el.textContent = '● Ollama KO';
        el.className   = 'ko';
        el.title       = 'Lance Ollama : ollama serve';
      } else if (!d.model_available) {
        el.textContent = `● ${d.model} absent`;
        el.className   = 'ko';
        el.title       = `Télécharge le modèle : ollama pull ${d.model}`;
      } else {
        el.textContent = `● ${d.model}`;
        el.className   = 'ok';
        el.title       = '';
      }
    } catch {
      el.textContent = '● offline';
      el.className   = 'ko';
    }
  }

  // ── Ingestion ────────────────────────────────────────────────────
  async function generate() {
    const text = document.getElementById('txt-input').value.trim();
    if (!text) return;

    const btn = document.getElementById('btn-generate');
    btn.disabled    = true;
    btn.innerHTML   = '<span class="spinner"></span>Génération en cours…';

    try {
      const r = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation: text }),
      });

      if (!r.ok) {
        let errorMsg = await readError(r);

        // Messages spécifiques par status
        if (r.status === 503) {
          errorMsg = `⚠️ Ollama indisponible\n${errorMsg}`;
        } else if (r.status === 500) {
          errorMsg = `❌ Erreur serveur\n${errorMsg}`;
        }
        
        throw new Error(errorMsg);
      }

      const d = await r.json();

      document.getElementById('result-success').textContent =
        `✓ Page ajoutée à la Knowledge Base`;
      document.getElementById('result-title').textContent = d.title;
      document.getElementById('result-tags').innerHTML =
        d.tags.map(t => `<span class="tag-badge">${escHtml(t)}</span>`).join('');
      document.getElementById('result-body').innerHTML = renderMarkdown(d.content);
      document.getElementById('result-box').classList.add('visible');
      loadKB();

    } catch (e) {
      alert('Erreur : ' + e.message);
    } finally {
      btn.disabled    = false;
      btn.textContent = '✦ Générer la documentation';
    }
  }

  // ── Knowledge Base ───────────────────────────────────────────────
  async function loadKB() {
    const r  = await fetch('/pages');
    allPages = await r.json();
    document.getElementById('kb-count').textContent =
      allPages.length + (allPages.length === 1 ? ' page' : ' pages');
    filterKB(document.getElementById('kb-search').value);
    loadTagCloud();
  }

  function renderKB(pages) {
    const list = document.getElementById('kb-list');
    if (!pages.length) {
      list.innerHTML = `<div class="kb-empty">
        Aucune page pour l'instant.<br>
        <a onclick="goTo('ingest', document.querySelectorAll('.nav-item')[1])">
          Ajouter une première source →
        </a>
      </div>`;
      return;
    }
    list.innerHTML = pages.map(p => `
      <div class="kb-card${p.filename === window.currentFilename ? ' active' : ''}" onclick="openPage(${allPages.indexOf(p)}, this)">
        <h4>${escHtml(p.title)}</h4>
        <div class="kb-card-tags">${p.tags.map(t => `<span>${escHtml(t)}</span>`).join('')}</div>
        <div class="kb-card-date">${p.created.slice(0,10)}</div>
      </div>
    `).join('');
  }

  async function openPage(index, card) {
    const page = allPages[index];
    if (!page) return;

    document.querySelectorAll('.kb-card').forEach(c => c.classList.remove('active'));
    if (card) card.classList.add('active');
    window.currentFilename = page.filename;

    try {
      const r = await fetch('/pages/' + encodeURIComponent(page.filename));
      if (!r.ok) throw new Error(await readError(r));
      const d = await r.json();

      document.getElementById('viewer-title').textContent = page.title;
      renderViewerTags(page.tags || []);
      document.getElementById('viewer-body').innerHTML = renderMarkdown(d.content || '');

      document.querySelector('.kb-viewer-empty').style.display = 'none';
      document.getElementById('viewer-content').classList.add('visible');
    } catch (e) {
      alert(`Erreur: ${e.message}`);
    }
  }

  function renderViewerTags(tags) {
    const tagsContainer = document.getElementById('viewer-tags');
    tagsContainer.innerHTML = tags.map(t => `<span class="tag-badge">${escHtml(t)}</span>`).join('');

    const actions = document.createElement('span');
    actions.className = 'viewer-actions';

    const editBtn = document.createElement('button');
    editBtn.textContent = '✏️ Éditer les tags';
    editBtn.className = 'edit-tags-btn';
    editBtn.onclick = () => enterTagEditMode(tags);

    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️ Supprimer';
    delBtn.className = 'edit-tags-btn delete-btn';
    delBtn.onclick = deleteCurrentPage;

    actions.append(editBtn, delBtn);
    tagsContainer.appendChild(actions);
  }

  async function deleteCurrentPage() {
    const filename = window.currentFilename;
    if (!filename || !confirm('Supprimer cette page ?')) return;
    const r = await fetch('/pages/' + encodeURIComponent(filename), { method: 'DELETE' });
    if (!r.ok) { alert('Erreur : ' + await readError(r)); return; }
    window.currentFilename = null;
    document.getElementById('viewer-content').classList.remove('visible');
    document.querySelector('.kb-viewer-empty').style.display = '';
    loadKB();
  }

  function renderMarkdown(md) {
    const html = window.marked ? marked.parse(md) : escHtml(md).replace(/\n/g, '<br>');
    return window.DOMPurify ? DOMPurify.sanitize(html) : html;
  }

  async function readError(r) {
    const text = await r.text();
    try {
      const data = JSON.parse(text);
      if (data.error) return data.error;
    } catch {}
    return `Erreur ${r.status}${text ? ': ' + text.slice(0, 200) : ''}`;
  }

  function filterKB(q) {
    const lq = q.toLowerCase();
    renderKB(allPages.filter(p =>
      p.title.toLowerCase().includes(lq) ||
      p.tags.some(t => t.toLowerCase().includes(lq))
    ));
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;')
            .replace(/'/g,'&#39;');
  }

  // ── Init ─────────────────────────────────────────────────────────
  checkHealth();
  setInterval(checkHealth, 30_000);
  loadKB();

  // ── Tag Cloud Functions ───────────────────────────────────────
  async function loadTagCloud() {
    try {
      const r = await fetch('/tags');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const tags = await r.json(); // [{name, count}]
      const container = document.getElementById('tags-container');
      container.innerHTML = tags.map(t =>
        `<span class="tag-badge" data-name="${escHtml(t.name)}">${escHtml(t.name)} (${t.count})</span>`).join('');
      container.querySelectorAll('.tag-badge').forEach(el => {
        el.onclick = () => {
          goTo('kb', document.querySelectorAll('.nav-item')[0]);
          document.getElementById('kb-search').value = el.dataset.name;
          filterKB(el.dataset.name);
        };
      });
    } catch (e) {
      console.error('Failed to load tags', e);
    }
  }

  async function enterTagEditMode(currentTags) {
    const newTags = prompt('Tags (séparés par des virgules)', currentTags.join(', '));
    if (newTags === null) return;
    const filename = window.currentFilename;
    if (!filename) return;
    const tagsArray = newTags.split(',').map(t => t.trim()).filter(t => t);
    try {
      const r = await fetch(`/pages/${encodeURIComponent(filename)}/tags`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tags: tagsArray})
      });
      if (!r.ok) throw new Error(await readError(r));
      const data = await r.json();
      const page = allPages.find(p => p.filename === filename);
      if (page) page.tags = data.tags;
      renderViewerTags(data.tags);
      filterKB(document.getElementById('kb-search').value);
      loadTagCloud();
    } catch (e) {
      alert('Erreur lors de la mise à jour des tags : ' + e.message);
    }
  }

</script>
